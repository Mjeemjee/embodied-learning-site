<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
    <title>单连杆运动学正解模拟器</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .simulator-container {
            display: flex;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 1px solid #d9d9d9;
            width: 1000px;
            height: 640px;
        }

        .control-panel {
            width: 320px;
            padding: 25px;
            background-color: #fafafa;
            border-right: 1px solid #e8e8e8;
            display: flex;
            flex-direction: column;
        }

        .canvas-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fff;
        }

        canvas {
            border: 1px solid #dcdcdc;
            background-color: #fdfdfd;
        }

        h1, h2, h3 {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            color: #003366;
            margin: 0;
            padding: 0;
        }
        
        h1 {
            font-size: 1.8em;
            margin-bottom: 10px;
            border-bottom: 2px solid #005a9e;
            padding-bottom: 10px;
        }

        h2 {
            font-size: 1.3em;
            margin-top: 20px;
            color: #333;
        }
        
        h3 {
            font-size: 1.2em;
            margin-top: 25px;
            color: #005a9e;
            border-top: 1px solid #e8e8e8;
            padding-top: 20px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 1em;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .value-display {
            font-weight: bold;
            color: #c82333;
            margin-left: 8px;
            font-family: 'Courier New', Courier, monospace;
        }
        
        .results-area {
            font-family: 'Courier New', Courier, monospace;
            background-color: #e9ecef;
            border-radius: 8px;
            padding: 15px;
            font-size: 1.1em;
            line-height: 1.8;
            border: 1px solid #dee2e6;
        }
        
        .results-area .formula {
            font-style: italic;
            color: #555;
            font-family: 'Cambria', 'Times New Roman', Times, serif;
        }
        
        .results-area .coord-value {
             font-weight: bold;
             color: #003366;
             background-color: #fff;
             padding: 2px 6px;
             border-radius: 4px;
        }
    </style>
<link rel="stylesheet" href="./simulator-common.css?v=4">
</head>
<body class="sim-linkage" data-simulator="linkage">

    <div class="simulator-container">
        <div class="control-panel">
            <h1>单连杆运动学模拟器</h1>
            
            <h2>模型参数</h2>
            <div class="control-group">
                <label for="linkLength">连杆长度 (L₁): <span id="linkLengthValue" class="value-display">150</span> px</label>
                <input type="range" id="linkLength" min="50" max="250" value="150">
            </div>
            <div class="control-group">
                <label for="theta1">关节角度 (θ₁): <span id="theta1Value" class="value-display">45</span> °</label>
                <input type="range" id="theta1" min="-180" max="180" value="45">
            </div>
            
            <h3>实时计算结果</h3>
            <div class="results-area">
                <div class="formula">X₁ = L₁ * cos(θ₁)</div>
                <div>X₁: <span id="resultX" class="coord-value">106.07</span></div>
                <br>
                <div class="formula">Y₁ = L₁ * sin(θ₁)</div>
                <div>Y₁: <span id="resultY" class="coord-value">106.07</span></div>
                <hr style="border: 0; border-top: 1px solid #ccc; margin: 10px 0;">
                <div>θ₁ (弧度): <span id="thetaRad" class="coord-value">0.785</span></div>
            </div>
            
        </div>
        <div class="canvas-container">
            <canvas id="simulatorCanvas" width="600" height="600"></canvas>
        </div>
    </div>

    <script>
        // DOM Element a
        const linkLengthSlider = document.getElementById('linkLength');
        const theta1Slider = document.getElementById('theta1');
        const linkLengthValueSpan = document.getElementById('linkLengthValue');
        const theta1ValueSpan = document.getElementById('theta1Value');
        const resultXSpan = document.getElementById('resultX');
        const resultYSpan = document.getElementById('resultY');
        const thetaRadSpan = document.getElementById('thetaRad');
        const canvas = document.getElementById('simulatorCanvas');
        const ctx = canvas.getContext('2d');

        // Main update and draw function
        function updateSimulator() {
            // 1. Get input values
            const L1 = parseFloat(linkLengthSlider.value);
            const theta1_deg = parseFloat(theta1Slider.value);
            
            // 2. Convert angle to radians for calculation
            const theta1_rad = theta1_deg * Math.PI / 180;
            
            // 3. Forward Kinematics Calculation
            const X1 = L1 * Math.cos(theta1_rad);
            const Y1 = L1 * Math.sin(theta1_rad);
            
            // 4. Update UI Displays
            linkLengthValueSpan.textContent = L1.toFixed(0);
            theta1ValueSpan.textContent = theta1_deg.toFixed(0);
            resultXSpan.textContent = X1.toFixed(2);
            resultYSpan.textContent = Y1.toFixed(2);
            thetaRadSpan.textContent = theta1_rad.toFixed(3);
            
            // 5. Redraw the canvas
            drawCanvas(L1, theta1_rad, X1, Y1, theta1_deg);
        }

        // Canvas drawing logic
        function drawCanvas(L1, theta1_rad, X1, Y1, theta1_deg) {
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;

            // Clear canvas
            ctx.clearRect(0, 0, width, height);
            
            // Save the default state
            ctx.save();
            
            // Move origin to the center and flip Y-axis for standard Cartesian coordinates
            ctx.translate(centerX, centerY);
            ctx.scale(1, -1);
            
            // Draw grid
            drawGrid();

            // Draw axes
            drawAxes();
            
            // Draw angle arc
            ctx.beginPath();
            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(255, 100, 100, 0.7)';
            ctx.arc(0, 0, 30, 0, theta1_rad, theta1_deg < 0);
            ctx.stroke();

            // Draw the link
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(X1, Y1);
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#005a9e';
            ctx.lineCap = 'round';
            ctx.stroke();

            // Draw the origin joint
            ctx.beginPath();
            ctx.arc(0, 0, 8, 0, 2 * Math.PI);
            ctx.fillStyle = '#003366';
            ctx.fill();

            // Draw the end-effector point P1
            ctx.beginPath();
            ctx.arc(X1, Y1, 8, 0, 2 * Math.PI);
            ctx.fillStyle = '#c82333';
            ctx.fill();

            // Restore the state to draw text normally
            ctx.restore();
            
            // Draw labels (after restoring state so text is not flipped)
            ctx.save();
            ctx.translate(centerX, centerY);
            
            // Label for theta1
            ctx.fillStyle = '#c82333';
            ctx.font = '14px Arial';
            ctx.fillText(`θ₁=${theta1_deg}°`, 40 * Math.cos(theta1_rad / 2), -40 * Math.sin(theta1_rad / 2));
            
            // Label for L1
            ctx.fillStyle = '#005a9e';
            ctx.font = 'bold 14px Arial';
            // Rotate context to align text with the link
            ctx.rotate(-theta1_rad);
            ctx.fillText(`L₁=${L1.toFixed(0)}`, L1 / 2 - 20, -10);
            
            ctx.restore();
        }

        function drawGrid() {
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 0.5;
            const step = 50;
            // Vertical lines
            for (let x = step; x < canvas.width / 2; x += step) {
                ctx.beginPath();
                ctx.moveTo(x, -canvas.height / 2);
                ctx.lineTo(x, canvas.height / 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(-x, -canvas.height / 2);
                ctx.lineTo(-x, canvas.height / 2);
                ctx.stroke();
            }
            // Horizontal lines
            for (let y = step; y < canvas.height / 2; y += step) {
                ctx.beginPath();
                ctx.moveTo(-canvas.width / 2, y);
                ctx.lineTo(canvas.width / 2, y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(-canvas.width / 2, -y);
                ctx.lineTo(canvas.width / 2, -y);
                ctx.stroke();
            }
        }
        
        function drawAxes() {
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1.5;
            // X-axis
            ctx.beginPath();
            ctx.moveTo(-canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, 0);
            ctx.stroke();
            // Y-axis
            ctx.beginPath();
            ctx.moveTo(0, -canvas.height / 2);
            ctx.lineTo(0, canvas.height / 2);
            ctx.stroke();
            
            // Axis labels (drawn in normal coordinate system)
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset transform for text
            ctx.fillStyle = '#333';
            ctx.font = 'bold 16px Arial';
            ctx.fillText('X', canvas.width - 20, canvas.height / 2 + 20);
            ctx.fillText('Y', canvas.width / 2 + 10, 20);
            ctx.restore();
        }

        // Event Listeners
        linkLengthSlider.addEventListener('input', updateSimulator);
        theta1Slider.addEventListener('input', updateSimulator);

        // Initial call to draw the simulator
        window.onload = updateSimulator;

    </script>
<script src="./simulator-common.js?v=4"></script>
</body>
</html>
